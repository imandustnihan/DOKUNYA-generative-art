name: reniz
description: An offline generative art studio for touch, pointer and remote input.
publish_to: none
version: 0.1.1+2
environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: '>=3.50.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.1.0
  file_selector: ^1.1.0
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  web: ^1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/LICENSE.txt
    - assets/fonts/Roboto_LICENSE.txt
  shaders:
    - shaders/liquid.frag
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
