name: Publish DOKUNYA website and real Flutter Studio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  DOKUNYA_BASE: /${{ github.event.repository.name }}/
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Flutter 3.50.0
        shell: bash
        run: |
          git clone --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Install and check Astro site
        shell: bash
        run: |
          npm --prefix site ci --no-audit --no-fund
          npm --prefix site run lint
          npm --prefix site run check
          npm --prefix site run build
      - name: Test and build real Flutter application at /studio/
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart analyze lib test
          flutter test --reporter expanded
          flutter build web --release --no-web-resources-cdn --base-href "$DOKUNYA_BASE"studio/
          python3 tool/prepare_web.py
      - name: Assemble and validate a single static Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/dist/studio site/dist/media
          cp -a build/web/. site/dist/studio/
          cp test/goldens/desktop.png site/dist/media/studio-preview.png
          cp web/favicon.png site/dist/favicon.png
          node site/scripts/post_build.mjs
          node site/scripts/verify.mjs --with-studio
      - name: Exercise the assembled Pages build before deployment
        shell: bash
        env:
          DOKUNYA_WEB_BASE: /${{ github.event.repository.name }}/studio/
        run: |
          set -euo pipefail
          (cd site && npx playwright install --with-deps chromium)
          npm --prefix site run smoke
          NODE_PATH="$PWD/site/node_modules" node tool/web_smoke.cjs site/dist/studio
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the tested web platform
        id: deployment
        uses: actions/deploy-pages@v4
