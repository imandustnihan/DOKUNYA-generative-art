name: Refresh DOKUNYA branded golden baselines (one-time)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-goldens-once.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Flutter and Dart
        shell: bash
        run: |
          git clone --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version
      - run: flutter pub get
      - name: Regenerate brand-specific golden baselines
        run: flutter test test/widget_test.dart --update-goldens --reporter expanded
      - name: Verify only expected golden PNGs changed
        shell: bash
        run: |
          set -euo pipefail
          git add test/goldens/*.png
          if git diff --cached --quiet; then
            echo 'No golden image changes required.'
            exit 0
          fi
          git diff --cached --name-only
          if git diff --cached --name-only | grep -Ev '^test/goldens/(small_phone|large_phone|large_text|tablet|desktop|tv)\.png$'; then
            echo 'Unexpected golden image modified.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: refresh DOKUNYA branded golden baselines'
          git push origin HEAD:main
