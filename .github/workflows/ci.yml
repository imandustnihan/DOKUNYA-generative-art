name: Validate and build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  CI: 'true'
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Flutter source and bundled Dart
        shell: bash
        run: |
          git clone --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - run: python3 tool/license_audit.py
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-test-failures
          path: test/failures
          if-no-files-found: ignore
  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: android
          - os: ubuntu-latest
            target: web
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: apple
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Flutter source and bundled Dart
        shell: bash
        run: |
          git clone --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Linux build dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: flutter pub get
      - name: Android development-signed APK
        if: matrix.target == 'android'
        run: flutter build apk --release
      - name: Web build with local renderer and offline cache
        if: matrix.target == 'web'
        run: |
          flutter build web --release --no-web-resources-cdn
          python3 tool/prepare_web.py
      - name: Linux native release
        if: matrix.target == 'linux'
        run: flutter build linux --release
      - name: Windows native release
        if: matrix.target == 'windows'
        run: flutter build windows --release
      - name: Apple sources validation
        if: matrix.target == 'apple'
        run: |
          flutter build macos --release
          flutter build ios --simulator --debug --no-codesign
      - name: Package exactly the built outputs
        shell: bash
        run: |
          mkdir -p dist
          case '${{ matrix.target }}' in
            android) cp build/app/outputs/flutter-apk/app-release.apk dist/DOKUNYA-android-devsigned.apk ;;
            web) python3 -m zipfile -c dist/DOKUNYA-web.zip build/web/* ;;
            linux) tar -czf dist/DOKUNYA-linux-x64.tar.gz -C build/linux/x64/release bundle ;;
            windows) powershell -Command "Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'dist/DOKUNYA-windows-x64.zip'" ;;
            apple)
              ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/DOKUNYA.app dist/DOKUNYA-macos-unsigned.zip
              ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app dist/DOKUNYA-ios-simulator-only.zip ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.target }}
          path: dist/*
          retention-days: 14

  release:
    needs: [quality, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: build-*
          path: release-assets
          merge-multiple: true
      - name: Publish only successful outputs from this tagged source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" --verify-tag --title "DOKUNYA $RELEASE_TAG" --notes-file ../docs/RELEASE_NOTES.md ./*
