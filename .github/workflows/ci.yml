name: Validate and build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  CI: 'true'
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Flutter source and bundled Dart
        shell: bash
        run: |
          git clone --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version
      - run: flutter pub get
      - name: Verify Dart formatting (print corrective diff on failure)
        shell: bash
        run: |
          if ! dart format --output=none --set-exit-if-changed .; then
            dart format .
            git diff -- lib test
            exit 1
          fi
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - run: python3 tool/license_audit.py
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-test-failures
          path: test/failures
          if-no-files-found: ignore
  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: android
          - os: ubuntu-latest
            target: web
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: apple
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Flutter source and bundled Dart
        shell: bash
        run: |
          git clone --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Linux build dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: flutter pub get
      - name: Cache Gradle distributions and downloaded dependencies
        if: matrix.target == 'android'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2
          key: android-gradle-${{ runner.os }}-${{ runner.arch }}-flutter350-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            android-gradle-${{ runner.os }}-${{ runner.arch }}-flutter350-
      - name: Install Android SDK CMake with retries
        if: matrix.target == 'android'
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$manager" ]]; then
            manager="$(command -v sdkmanager)"
          fi
          for attempt in 1 2 3 4; do
            if "$manager" --sdk_root="$sdk_root" "cmake;3.22.1"; then
              echo "Android CMake 3.22.1 installed"
              exit 0
            fi
            echo "::warning::CMake download failed (attempt $attempt/4)"
            sleep "$((attempt * 5))"
          done
          echo "::error::Unable to install required Android CMake after four attempts"
          exit 1
      - name: Android development-signed APK
        if: matrix.target == 'android'
        run: bash tool/build_android_ci.sh
      - name: Inspect built APK identity, permissions and signature
        if: matrix.target == 'android'
        shell: bash
        run: |
          set -euo pipefail
          sdk_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          apk=build/app/outputs/flutter-apk/app-release.apk
          mkdir -p dist
          "$sdk_tools/apksigner" verify --verbose --print-certs "$apk" > dist/android-signature.txt
          "$sdk_tools/aapt" dump badging "$apk" > dist/android-manifest.txt
          grep -F "package: name='dev.artpulse.artpulse'" dist/android-manifest.txt
          "$sdk_tools/aapt" dump permissions "$apk" > dist/android-permissions.txt
      - name: Web build with local renderer and offline cache
        if: matrix.target == 'web'
        run: |
          flutter build web --release --no-web-resources-cdn
          python3 tool/prepare_web.py
      - name: Linux native release
        if: matrix.target == 'linux'
        run: flutter build linux --release
      - name: Windows native release
        if: matrix.target == 'windows'
        run: flutter build windows --release
      - name: Apple sources validation
        if: matrix.target == 'apple'
        run: |
          flutter build macos --release
          flutter build ios --simulator --debug --no-codesign
      - name: Package exactly the built outputs
        shell: bash
        run: |
          mkdir -p dist
          case '${{ matrix.target }}' in
            android) cp build/app/outputs/flutter-apk/app-release.apk dist/DOKUNYA-android-devsigned.apk ;;
            web) python3 -m zipfile -c dist/DOKUNYA-web.zip build/web/* ;;
            linux) tar -czf dist/DOKUNYA-linux-x64.tar.gz -C build/linux/x64/release bundle ;;
            windows) powershell -Command "Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'dist/DOKUNYA-windows-x64.zip'" ;;
            apple)
              ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/DOKUNYA.app dist/DOKUNYA-macos-unsigned.zip
              ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app dist/DOKUNYA-ios-simulator-only.zip ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.target }}
          path: dist/*
          retention-days: 14

  release:
    needs: [quality, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: build-*
          path: release-assets
          merge-multiple: true
      - name: Publish only successful outputs from this tagged source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" --verify-tag --title "DOKUNYA $RELEASE_TAG" --notes-file ../docs/RELEASE_NOTES.md ./*
