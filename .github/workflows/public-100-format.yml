name: Format public 100-instrument proposal
on:
  push:
    branches:
      - feature/public-100-instruments
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Set up Flutter and Dart formatter
        shell: bash
        run: |
          git clone --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Format changed Dart sources
        shell: bash
        run: |
          dart format \
            lib/core/graphics/engine_catalog.dart \
            lib/core/graphics/procedural_instruments.dart \
            lib/core/graphics/art_model.dart \
            lib/core/graphics/art_engine.dart \
            lib/core/graphics/art_painter.dart \
            lib/app/studio_controller.dart \
            lib/app/dokunya_app.dart \
            lib/localization/strings.dart \
            test/instrument_catalog_test.dart
      - name: Commit formatted code to feature branch only
        shell: bash
        run: |
          if git diff --quiet -- lib test; then
            echo "Formatting already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "chore: format public 100-instrument proposal"
          git push origin HEAD:feature/public-100-instruments
